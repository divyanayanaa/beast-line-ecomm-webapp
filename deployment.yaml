apiVersion: apps/v1
kind: Deployment
metadata:
  name: beastline-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beastline-frontend
  template:
    metadata:
      labels:
        app: beastline-frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/beastline-frontend:latest
          ports:
            - containerPort: 5173
